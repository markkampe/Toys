<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pedcalc</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
  </style>
</head>

<body>
  <h2>Pedagogical Arithmetic Calculator</h2>

  <!-- Input Widgets -->
  <div class="row">
    <input type="text" id="eqn", placeholder="equation" />
    <button id="calcBtn">Calculate</button>
  </div>
  <div class="row">
    <input type="text" id="num1", placeholder="number" />
    <input type="text" id="num2", placeholder="number" />
    <button id="fctBtn">Factor</button>
    <button id="gcfBtn">GCF</button>
    <button id="lcmBtn">LCM</button>
  </div>

  <!-- Output Display (pre-formatted) -->
  <div>
    <h3>Results</h3>
    <p><pre id="result"> </pre></p>
  </div>

  <!-- Clear button at the bottom -->
  <div class="row">
    <button id="clrBtn">Clear</button>
  </div>

  <!-- Javascript calculation modules -->
  <script src="./decimals.js" type="text/javascript"></script>
  <script src="./ped_add.js" type="text/javascript"></script>
  <script src="./ped_sub.js" type="text/javascript"></script>
  <script src="./ped_mul.js" type="text/javascript"></script>
  <script src="./ped_div.js" type="text/javascript"></script>
  <script src="./factors.js" type="text/javascript"></script>

  <!-- Primary Input Processing -->
  <script>
    const resultDisplay = document.getElementById('result');
    const eqnInput = document.getElementById('eqn');
    const calcBtn = document.getElementById('calcBtn');
	const clrBtn = document.getElementById('clrBtn');
    const num1Input = document.getElementById('num1');
    const num2Input = document.getElementById('num2');
    const fctBtn = document.getElementById('fctBtn');
    const gcfBtn = document.getElementById('gcfBtn');
    const lcmBtn = document.getElementById('lcmBtn');

	// calculate button pressed
    calcBtn.addEventListener('click', () => {
      // gather input and make sure it is non-null
      input = eqnInput.value.trim();
      if (input.length == 0) {
        resultDisplay.textContent = "";
      	return;
      }
      resultDisplay.textContent = arithmetic(input);
    });

	// Enter pressed in equation field
    eqnInput.addEventListener('keydown', (event) => {
      if (event.key === "Enter") {
		  input = eqnInput.value.trim();
		  if (input.length == 0) {
				resultDisplay.textContent = "";
				return;
		  }
          resultDisplay.textContent = arithmetic(input);
      }
    });

	// Factor button pressed
    fctBtn.addEventListener('click', () => {
      // gather input and make sure it is non-null
      num1 = num1Input.value.trim();
	  output = twoNumbers(num1, "0", true);
	  if (output !== "")
		  resultDisplay.textContent = output;
	  else
		  resultDisplay.textContent = factor(num1);
    });

	// GCF button pressed
    gcfBtn.addEventListener('click', () => {
      // gather input and make sure it is non-null
      num1 = num1Input.value.trim();
      num2 = num2Input.value.trim();
	  output = twoNumbers(num1, num2, true);
	  if (output !== "")
		  resultDisplay.textContent = output;
	  else
		  resultDisplay.textContent = greatest_common_factor(num1, num2, true);
    });

	// LCM button pressed
    lcmBtn.addEventListener('click', () => {
      // gather input and make sure it is non-null
      num1 = num1Input.value.trim();
      num2 = num2Input.value.trim();
	  output = twoNumbers(num1, num2, true);
	  if (output !== "")
		  resultDisplay.textContent = output;
	  else
		  resultDisplay.textContent = least_common_multiple(num1, num2);
    });

	// Clear button pressed
    clrBtn.addEventListener('click', () => {
        resultDisplay.textContent = "";
		eqnInput.value = "";
		num1Input.value = "";
		num2Input.value = "";
      	return;
    });

	/**
	 * validate that we have two numeric parameters
	 *
	 * @param {string} num1 - first operand
	 * @parma {string} num2 - second operand
	 * @parm {boolean} integer - required to be integers
	 * @return {string} error, empty if both parameters correct
	 */
	function twoNumbers(num1, num2, integers) {
		// confirm both are non-null
		if (num1 == "" || num2 == "")
			return "TWO OPERANDS REQUIRED";
		// confirm first is valid numeric string
		val1 = Number(num1);
		if (!Number.isFinite(val1))
			return "NON-NUMERIC OPERAND: " + num1;
		if (integers && !Number.isInteger(val1))
			return "NON-INTEGER OPERAND: " + num1;
		// confirm second is valid numeric string
		val2 = Number(num2);
		if (!Number.isFinite(val2))
			return "NON-NUMERIC OPERAND: " + num2;
		if (integers && !Number.isInteger(val2))
			return "NON-INTEGER OPERAND: " + num2;

		// no errors
		return "";
	}

	/**
	 * lex and evaluate an arithmetic expression
	 *
	 * @param {string} expr - expression to be evaluated
	 *		<number> <operator> <number> ... blanks ignored
	 * @return {string} - error or evaluation of that expression
	 */
	function arithmetic(expr) {
		len = expr.length;

		// find the operator and operands
		const operators = ["+", "-", "*", "/"];
		for (const op of operators) {
			x = expr.indexOf(op);
			if (x >= 0) {
				// confirm we have two numeric operands
				num1 = expr.substring(0,x).trim();
				num2 = expr.substring(x+1,len).trim();
				var output = twoNumbers(num1, num2, false);
				if (output !== "")
					return output;

				// perform the requested operation
				switch (op) {
				  case "+":
					return add(num1, num2);
				  case "-":
					return subtract(num1, num2);
				  case "*":
					return multiply(num1, num2);
				  case "/":
					return divide(num1, num2);
				}
			}
		}
		// did not find any supported operator
		return "NO OPERATOR IN EXPRESSION";
	}
</script>

</body>
</html>
